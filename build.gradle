plugins {
    id 'eclipse'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "kaleidoscopedoll-${minecraft_version}-fabric"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "kaleidoscopedoll" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        configureEach {
            client()
            jvmArguments.add("-Dkaleidoscope.sourceRoot=${project.projectDir}")
        }
    }
}

fabricApi {
    configureDataGeneration()
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = 'Local libs'
        url = uri('libs-local')
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.github.ysbbbbbb:forge-config-api-port-fabric:26.2.1"
    implementation "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
    implementation "maven.modrinth:jade:${project.jade_version}"
    compileOnly "maven.modrinth:trinkets-updated:4.1.0-beta.3+26.2"

    compileOnly "com.electronwill.night-config:core:${project.night_config_version}"
    localRuntime "com.electronwill.night-config:core:${project.night_config_version}"
    localRuntime "com.electronwill.night-config:toml:${project.night_config_version}"
}

configurations {
    shadeFcap
}

dependencies {
    shadeFcap "com.github.ysbbbbbb:forge-config-api-port-fabric:26.2.1"
}

loom {
    nestJars(tasks.named('jar', Jar.class), configurations.named('shadeFcap'))
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}
